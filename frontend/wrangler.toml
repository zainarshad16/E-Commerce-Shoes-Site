#:schema node_modules/wrangler/config-schema.json
name = "aether-footwear-storefront"
main = ".open-next/worker.js"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true

[vars]
NEXT_PUBLIC_SITE_URL = "https://atelier-vance-storefront.vercel.app"
NEXT_PUBLIC_API_URL = "https://backend-six-alpha-26.vercel.app/api/v1"
NEXT_PUBLIC_R2_CDN_URL = "https://cdn.aetherfootwear.com"

# Set REVALIDATE_SECRET via `wrangler secret put REVALIDATE_SECRET`

